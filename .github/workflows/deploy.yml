name: Deploy to Production

# Aufbau wie bei Offyce: bauen auf GitHub, per scp nach Hostpoint hochladen,
# per ssh Composer, Migrationen und Caches auf dem Server.
# Einrichtung Schritt für Schritt: docs/go-live.md

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Nie zwei Deploys gleichzeitig – der zweite wartet.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Der Build braucht PHP (Wayfinder erzeugt die Routen-Helfer über artisan) –
      # dieselbe Version wie auf dem Server.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, curl, gd, intl, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          composer install --no-dev --optimize-autoloader

      - name: Build Assets
        run: npm run build

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # composer.lock gehört mit hoch: der Server kommt nicht an GitHub heran,
          # kann sie also nicht selbst holen. storage bleibt auf dem Server (Medien,
          # interaktive Grafiken, Schlüssel), .env ebenso – beide nie überschreiben.
          # moodle-plugin muss mit: /admin/lti gibt es von dort als ZIP aus.
          source: ".,!.git,!.github,!.ddev,!node_modules,!vendor,!storage,!storage.zip,!tests,!phpunit.xml,!.env"
          target: ~/www/motionbase.ch
          strip_components: 0

      - name: Execute Remote Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            cd ~/www/motionbase.ch
            # Ohne .env migriert Laravel still in eine SQLite-Datei und cacht eine
            # Config ohne APP_KEY – jede Seite antwortet dann mit 500.
            test -f .env || { echo "Die .env fehlt auf dem Server – siehe docs/go-live.md, Schritt 4."; exit 1; }
            # storage kommt per scp nicht mit (!storage), das Gerüst muss also hier
            # entstehen. Fehlt storage/framework/views, bricht view:cache ab.
            mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache/data storage/logs storage/app/private storage/app/public storage/lti bootstrap/cache
            chmod -R ug+rwx storage bootstrap/cache
            /usr/local/php83/bin/composer install --no-dev --optimize-autoloader --no-interaction
            # Die Schlüssel bleiben auf dem Server und werden nur erzeugt, wenn
            # keine da sind: neue Passport-Schlüssel würden alle MCP-Zugänge
            # abmelden, ein neues LTI-Paar müssten die Moodles neu abholen.
            test -f storage/oauth-private.key || /usr/local/php83/bin/php artisan passport:keys --no-interaction
            test -f storage/lti/private.pem || {
              openssl genrsa -out storage/lti/private.pem 2048
              openssl rsa -in storage/lti/private.pem -pubout -out storage/lti/public.pem
              chmod 600 storage/lti/private.pem
            }
            # chmod -R oben macht die Schlüssel 770. Passport lässt nur 600/660 gelten und
            # antwortet sonst auf /mcp und /oauth/authorize mit 500; der LTI-Schlüssel bleibt so eng wie angelegt.
            chmod 600 storage/oauth-private.key storage/lti/private.pem
            chmod 660 storage/oauth-public.key
            /usr/local/php83/bin/php artisan storage:link
            # Erst den alten Cache weg, sonst migriert Laravel mit veralteten .env-Werten.
            /usr/local/php83/bin/php artisan config:clear
            /usr/local/php83/bin/php artisan migrate --force
            /usr/local/php83/bin/php artisan config:cache
            /usr/local/php83/bin/php artisan route:cache
            /usr/local/php83/bin/php artisan view:cache
